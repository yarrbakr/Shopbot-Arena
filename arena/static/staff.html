<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TufShop — Staff queue</title>
<style>
  :root{color-scheme:light dark}
  body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:32px auto;padding:0 16px}
  h1{font-size:20px} .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #8883;vertical-align:top}
  button{font:inherit;padding:9px 13px;border-radius:8px;border:none;background:#0a9080;color:#fff;cursor:pointer}
  .msg{margin-top:12px;font-size:13px;color:#888}
  a{color:#2563eb;font-size:13px}
  .empty{color:#888;font-size:13px;margin-top:12px}
</style>
</head>
<body>
  <div class="top">
    <h1>Staff — triage queue</h1>
    <div><button id="run" type="button">Run triage once</button> · <a href="/login" id="out">sign out</a></div>
  </div>
  <p class="msg">The internal agent reads each open ticket (customer-written text) and acts with staff privilege.</p>
  <table id="queue"><thead><tr><th>#</th><th>Account</th><th>Order</th><th>Subject</th></tr></thead><tbody></tbody></table>
  <div class="empty" id="empty" hidden>Queue is empty.</div>
  <div class="msg" id="result"></div>
<script>
  const auth = (() => { try { return JSON.parse(localStorage.getItem("tufshop")); } catch(e){ return null; } })();
  if (!auth || auth.role !== "staff") location.href = "/login";

  async function load() {
    const r = await fetch("/api/staff/queue?token=" + encodeURIComponent(auth.token));
    if (!r.ok) { location.href = "/login"; return; }
    const q = await r.json();
    document.querySelector("#queue tbody").innerHTML = q.map(t =>
      `<tr><td>${t.id}</td><td>${t.account||""}</td><td>${t.order_id||""}</td><td>${t.subject||""}</td></tr>`).join("");
    document.getElementById("empty").hidden = q.length > 0;
    document.getElementById("queue").hidden = q.length === 0;
  }
  document.getElementById("run").addEventListener("click", async () => {
    const r = await fetch("/api/staff/triage/run_once", {method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({token:auth.token})});
    const d = await r.json();
    document.getElementById("result").textContent =
      (d.sessions ? d.sessions.length : 0) + " ticket(s) processed.";
    load();
  });
  document.getElementById("out").addEventListener("click", () => { try{ localStorage.removeItem("tufshop"); }catch(e){} });
  load();
</script>
</body>
</html>
